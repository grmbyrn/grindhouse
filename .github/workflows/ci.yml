name: CI

on:
    pull_request:
    push:
        branches: [main]

# A newer push to the same branch or PR cancels the run still in progress
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            # Download the MongoDB test binary to the folder cached below
            MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      frontend/package-lock.json

            - name: Install dependencies
              run: |
                  npm ci
                  npm ci --prefix frontend

            # The MongoDB binary used by the backend tests (~100 MB); version pinned in package.json
            - name: Cache MongoDB test binary
              uses: actions/cache@v4
              with:
                  path: /home/runner/.cache/mongodb-binaries
                  key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package.json') }}

            - name: Lint and format check
              run: npm run check

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Build frontend
              run: npm run build --prefix frontend
